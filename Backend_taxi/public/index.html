<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation VSL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Couleurs inspirées de ton application mobile */
        .bg-primary { background-color: #FF6B00; }
        .text-primary { color: #FF6B00; }
        .btn-primary:hover { background-color: #E65100; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
        <div class="bg-primary p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Réserver un transport médical</h1>
            <p class="text-sm opacity-90 mt-2">Votre demande sera confirmée par le chauffeur.</p>
        </div>

        <form id="bookingForm" class="p-6 space-y-4">
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nom & Prénom</label>
                    <input type="text" id="patientName" required class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Téléphone</label>
                    <input type="tel" id="patientPhone" required class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">De (Adresse exacte)</label>
                <input type="text" id="startLocation" required placeholder="Ex: 12 Rue des Lilas, Toulouse" class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">À (Hôpital, Clinique...)</label>
                <input type="text" id="endLocation" required placeholder="Ex: Clinique Pasteur" class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Date</label>
                    <input type="date" id="date" required class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Heure de RDV</label>
                    <input type="time" id="time" required class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Type de transport</label>
                <select id="type" class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400">
                    <option value="Aller">Aller simple</option>
                    <option value="Retour">Retour simple</option>
                    <option value="Consultation">Aller-Retour (Consultation)</option>
                    <option value="Hospit">Entrée / Sortie d'hospitalisation</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Notes (Optionnel)</label>
                <textarea id="notes" rows="2" placeholder="Code porte, étage, besoin d'aide..." class="w-full bg-gray-100 rounded-xl p-3 outline-none focus:ring-2 focus:ring-orange-400"></textarea>
            </div>

            <div id="statusMessage" class="hidden p-3 rounded-xl text-center font-bold text-sm"></div>

            <button type="submit" id="submitBtn" class="w-full bg-primary btn-primary text-white font-bold text-lg rounded-xl p-4 mt-4 transition-colors">
                ENVOYER LA DEMANDE
            </button>
        </form>
    </div>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            // État de chargement
            btn.disabled = true;
            btn.innerText = "Envoi en cours...";
            statusMsg.classList.add('hidden');

            const payload = {
                patientName: document.getElementById('patientName').value,
                patientPhone: document.getElementById('patientPhone').value,
                startLocation: document.getElementById('startLocation').value,
                endLocation: document.getElementById('endLocation').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                type: document.getElementById('type').value,
                notes: document.getElementById('notes').value
            };

            try {
                // ⚠️ REMPLACE CETTE URL PAR TON URL BACKEND RÉELLE
                const response = await fetch('https://ton-backend-api.com/api/rides/web-booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.innerText = "✅ " + data.message;
                    statusMsg.className = "p-3 rounded-xl text-center font-bold text-sm bg-green-100 text-green-700 block";
                    document.getElementById('bookingForm').reset();
                } else {
                    statusMsg.innerText = "❌ " + (data.error || "Une erreur est survenue.");
                    statusMsg.className = "p-3 rounded-xl text-center font-bold text-sm bg-red-100 text-red-700 block";
                }
            } catch (error) {
                statusMsg.innerText = "❌ Impossible de contacter le serveur.";
                statusMsg.className = "p-3 rounded-xl text-center font-bold text-sm bg-red-100 text-red-700 block";
            } finally {
                btn.disabled = false;
                btn.innerText = "ENVOYER LA DEMANDE";
            }
        });
    </script>
</body>
</html>
