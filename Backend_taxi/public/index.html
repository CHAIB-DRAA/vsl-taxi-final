<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un Taxi Conventionné VSL à Toulouse | Taxi 31</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <style>
        :root { --navy: #0f172a; --navy2: #1e293b; --yellow: #facc15; --text: #f1f5f9; --muted: #94a3b8; }
        body { background-color: var(--navy); color: var(--text); font-family: 'Inter', sans-serif; }
        input, select, textarea { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 14px 16px 14px 48px; color: var(--text); outline: none; }
        input:focus, select:focus { border-color: var(--yellow); }
        .btn-submit { width: 100%; background: var(--yellow); color: var(--navy); font-weight: 800; padding: 17px; border-radius: 14px; box-shadow: 0 8px 32px rgba(250,204,21,0.2); }
    </style>
</head>
<body class="p-4">

    <main class="max-w-2xl mx-auto mt-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-black text-white">Réservation Taxi VSL</h1>
            <p class="text-muted mt-2">Agréé CPAM - 100% ALD</p>
        </header>

        <section class="bg-slate-800 rounded-3xl p-8 border border-white/5 shadow-2xl">
            <form id="bookingForm" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="patientName" required placeholder="Nom du patient">
                    <input type="tel" id="patientPhone" required placeholder="Téléphone">
                </div>

                <input type="text" id="startLocation" required placeholder="Lieu de prise en charge">
                <input type="text" id="endLocation" required placeholder="Destination (Hôpital, Clinique...)">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="date" id="date" required>
                    <input type="time" id="time" required>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <select id="type">
                        <option value="Aller">Aller simple</option>
                        <option value="Consultation">Aller-Retour (Consultation)</option>
                        <option value="Hospit">Entrée / Sortie d'hospitalisation</option>
                    </select>
                    
                    <select id="btStatus" required>
                        <option value="" disabled selected>Bon de transport (PMT) ?</option>
                        <option value="Papier">Je l'ai (Format papier)</option>
                        <option value="Mail">Je l'ai (Mail / Smartphone)</option>
                        <option value="Medecin">À demander au médecin</option>
                        <option value="Service">À récupérer au service</option>
                    </select>
                </div>

                <textarea id="notes" rows="2" placeholder="Notes (Code porte, étage, fauteuil...)"></textarea>

                <div id="statusMessage" class="hidden p-4 rounded-xl text-center font-bold"></div>

                <button type="submit" id="submitBtn" class="btn-submit transform hover:scale-[1.02] transition-all">
                    CONFIRMER LA RÉSERVATION
                </button>
            </form>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => { lucide.createIcons(); });

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerText = "ENVOI EN COURS...";

            // Calcul du décalage horaire pour Render (UTC)
            const dateInput = document.getElementById('date').value;
            const timeInput = document.getElementById('time').value;
            const localDate = new Date(`${dateInput}T${timeInput}`);
            const utcTime = `${String(localDate.getUTCHours()).padStart(2,'0')}:${String(localDate.getUTCMinutes()).padStart(2,'0')}`;

            const payload = {
                patientName: document.getElementById('patientName').value,
                patientPhone: document.getElementById('patientPhone').value,
                startLocation: document.getElementById('startLocation').value,
                endLocation: document.getElementById('endLocation').value,
                date: dateInput,
                time: utcTime,
                type: document.getElementById('type').value,
                btStatus: document.getElementById('btStatus').value,
                notes: document.getElementById('notes').value,
                source: "Web VSL Form"
            };

            try {
                const res = await fetch('/api/rides/web-booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    statusMsg.innerText = "✅ Demande reçue ! Confirmation par SMS.";
                    statusMsg.className = "p-4 rounded-xl text-center bg-green-500/10 text-green-400 block";
                    document.getElementById('bookingForm').reset();
                } else {
                    throw new Error();
                }
            } catch (err) {
                statusMsg.innerText = "❌ Erreur. Appelez-nous au 07 72 33 98 92.";
                statusMsg.className = "p-4 rounded-xl text-center bg-red-500/10 text-red-400 block";
            } finally {
                btn.disabled = false;
                btn.innerText = "CONFIRMER LA RÉSERVATION";
            }
        });
    </script>
</body>
</html>
