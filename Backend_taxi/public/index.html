<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Réserver un Taxi Conventionné VSL à Toulouse | Taxi 31 Toulouse</title>
    <meta name="description" content="Réservez votre transport médical assis (VSL) à Toulouse. Taxi agréé CPAM, tiers-payant intégral (100% ALD). Chauffeur professionnel et ponctuel.">
    <meta name="keywords" content="réserver vsl toulouse, taxi conventionné cpam, transport médical toulouse, vsl purpan, vsl oncopole">
    
    <meta property="og:title" content="Réservation Taxi Conventionné VSL - Taxi 31 Toulouse">
    <meta property="og:description" content="Votre trajet médicalisé sans avance de frais. Agréé CPAM 31.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://vsl-taxi.onrender.com/">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .bg-dark-900 { background-color: #0f172a; }
        .bg-slate-800 { background-color: #1e293b; }
        .accent-yellow { color: #eab308; }
        .btn-taxi { background-color: #eab308; color: #0f172a; }
        .btn-taxi:hover { background-color: #facc15; }
    </style>
</head>
<body class="bg-dark-900 text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-4">
                <div class="bg-yellow-500 p-2 rounded-lg text-slate-900">
                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                </div>
                <span class="text-2xl font-extrabold text-white tracking-tight">Taxi<span class="text-yellow-500">31</span>Toulouse</span>
            </div>
            <h1 class="text-3xl font-bold text-white">Réservation de Transport Médical</h1>
            <p class="text-slate-400 mt-2 italic">Agréé CPAM - Prise en charge à 100% (ALD)</p>
        </div>

        <div class="bg-slate-800 rounded-3xl shadow-2xl overflow-hidden border border-slate-700">
            <div class="bg-blue-600/10 p-4 text-center border-b border-blue-500/20">
                <p class="text-blue-400 text-sm font-semibold flex items-center justify-center gap-2">
                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                    Tiers-Payant appliqué : Zéro avance de frais
                </p>
            </div>

            <form id="bookingForm" class="p-8 space-y-6">
                
                <input type="hidden" id="chauffeurId" value="TON_ID_MONGO_ICI">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Nom du Patient</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-4 top-3.5 text-slate-500 w-5 h-5"></i>
                            <input type="text" id="patientName" required placeholder="Nom complet" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Téléphone</label>
                        <div class="relative">
                            <i data-lucide="phone" class="absolute left-4 top-3.5 text-slate-500 w-5 h-5"></i>
                            <input type="tel" id="patientPhone" required placeholder="06 00 00 00 00" 
                                class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Lieu de Prise en Charge</label>
                    <div class="relative">
                        <i data-lucide="home" class="absolute left-4 top-3.5 text-slate-500 w-5 h-5"></i>
                        <input type="text" id="startLocation" required placeholder="Adresse exacte (Domicile, Clinique...)" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Destination</label>
                    <div class="relative">
                        <i data-lucide="hospital" class="absolute left-4 top-3.5 text-blue-500 w-5 h-5"></i>
                        <input type="text" id="endLocation" required placeholder="Hôpital Purpan, Oncopole, Pasteur..." 
                            class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Date du Trajet</label>
                        <div class="relative">
                            <i data-lucide="calendar" class="absolute left-4 top-3.5 text-slate-500 w-5 h-5"></i>
                            <input type="date" id="date" required 
                                class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Heure du RDV</label>
                        <div class="relative">
                            <i data-lucide="clock" class="absolute left-4 top-3.5 text-slate-500 w-5 h-5"></i>
                            <input type="time" id="time" required 
                                class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white">
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Type de demande médicalisée</label>
                    <select id="type" class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-3.5 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white appearance-none">
                        <option value="Aller">Aller simple</option>
                        <option value="Retour">Retour simple</option>
                        <option value="Consultation">Aller-Retour (Consultation)</option>
                        <option value="Hospit">Entrée / Sortie d'hospitalisation</option>
                        <option value="Dialyse">Série de soins (Dialyse/Chimio)</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider ml-1">Notes ou Besoins Spécifiques</label>
                    <textarea id="notes" rows="2" placeholder="Code porte, fauteuil roulant, étage..." 
                        class="w-full bg-slate-900 border border-slate-700 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-yellow-500 transition-all text-white"></textarea>
                </div>

                <div id="statusMessage" class="hidden p-4 rounded-2xl text-center font-bold text-sm"></div>

                <button type="submit" id="submitBtn" class="w-full btn-taxi font-black text-xl rounded-2xl p-5 shadow-xl shadow-yellow-500/10 flex items-center justify-center gap-3 transform hover:scale-[1.02] transition-all">
                    CONFIRMER MA RÉSERVATION
                </button>

                <p class="text-center text-[10px] text-slate-500 uppercase tracking-widest font-bold">
                    Taxi conventionné Haute-Garonne - 24h/7j - 07 72 33 98 92
                </p>
            </form>
        </div>
    </div>

    <script>
        // Initialisation des icônes Lucide
        lucide.createIcons();

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerHTML = `<div class="w-6 h-6 border-4 border-slate-900 border-t-transparent rounded-full animate-spin"></div> Envoi en cours...`;
            statusMsg.classList.add('hidden');

            // 🚀 CORRECTION FUSEAU HORAIRE ICI
            // 1. On récupère la date et l'heure saisies par le patient
            const dateInput = document.getElementById('date').value;
            const timeInput = document.getElementById('time').value;
            
            // 2. On demande au navigateur du patient de fusionner les deux
            // Le navigateur va nativement appliquer l'heure d'été/hiver française
            const localDateTime = new Date(`${dateInput}T${timeInput}`);

            const payload = {
                patientName: document.getElementById('patientName').value,
                patientPhone: document.getElementById('patientPhone').value,
                startLocation: document.getElementById('startLocation').value,
                endLocation: document.getElementById('endLocation').value,
                
                // 3. On envoie au serveur la date au format Universel Absolu (ISOString)
                // Ex: S'il tape 09:00, ça envoie 07:00Z. Mongoose la sauvegardera parfaitement !
                date: localDateTime.toISOString(), 
                time: timeInput, // On le garde au cas où ton backend l'utilise pour autre chose
                
                type: document.getElementById('type').value,
                notes: document.getElementById('notes').value,
                source: "Web VSL Form",
                chauffeurId: document.getElementById('chauffeurId').value
            };

            try {
                const response = await fetch('/api/rides/web-booking', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.innerText = "✅ Demande reçue ! Votre chauffeur vous confirmera le trajet par SMS.";
                    statusMsg.className = "p-4 rounded-2xl text-center font-bold text-sm bg-green-500/10 text-green-400 border border-green-500/20 block";
                    document.getElementById('bookingForm').reset();
                    btn.innerText = "DEMANDE ENVOYÉE";
                } else {
                    throw new Error(data.error || "Erreur serveur");
                }
            } catch (error) {
                statusMsg.innerText = "❌ Une erreur est survenue. Merci de nous appeler au 07 72 33 98 92.";
                statusMsg.className = "p-4 rounded-2xl text-center font-bold text-sm bg-red-500/10 text-red-400 border border-red-500/20 block";
                btn.disabled = false;
                btn.innerText = "RÉESSAYER";
            }
        });
    </script>
</body>
</html>
