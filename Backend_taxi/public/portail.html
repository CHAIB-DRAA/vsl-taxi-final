<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portail Chauffeur | Taxi 31</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-slate-800 relative">

    <!-- ÉCRAN DE CONNEXION -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
            <div class="text-center mb-8">
                <div class="bg-yellow-500 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="car" class="w-8 h-8 text-slate-900"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Espace Chauffeur</h1>
                <p class="text-slate-400 text-sm mt-1">Connectez-vous avec vos identifiants</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <input type="email" id="email" required placeholder="Adresse email" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl p-4 text-white focus:border-yellow-500 outline-none">
                <input type="password" id="password" required placeholder="Mot de passe" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl p-4 text-white focus:border-yellow-500 outline-none">
                <p id="login-error" class="text-red-400 text-sm hidden font-bold text-center">Identifiants incorrects</p>
                <button type="submit" class="w-full bg-yellow-500 text-slate-900 font-bold text-lg rounded-xl p-4 hover:bg-yellow-400 transition-colors">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <!-- TABLEAU DE BORD PERSONNEL -->
    <div id="dashboard-screen" class="hidden flex h-full">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="bg-yellow-500 p-2 rounded-lg text-slate-900"><i data-lucide="layout-dashboard" class="w-6 h-6"></i></div>
                <span class="text-xl font-bold">Mon<span class="text-yellow-500">Planning</span></span>
            </div>
            <div class="mt-auto p-4 border-t border-slate-800">
                <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 w-full text-slate-400 hover:text-red-400 transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Me déconnecter
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="flex-1 flex flex-col h-full overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-8 py-5 flex justify-between items-center sticky top-0 z-10">
                <h1 class="text-2xl font-bold">Gestion des Courses & Facturation</h1>
                <div class="bg-yellow-100 text-yellow-800 px-4 py-2 rounded-full font-bold text-sm" id="ride-count">
                    0 course(s)
                </div>
            </header>

            <div class="p-8">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[800px]">
                        <thead>
                            <tr class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                                <th class="px-6 py-4">Date</th>
                                <th class="px-6 py-4">Patient</th>
                                <th class="px-6 py-4">Trajet</th>
                                <th class="px-6 py-4">Statut</th>
                                <th class="px-6 py-4">Facturation</th>
                                <th class="px-6 py-4 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="rides-table" class="divide-y divide-slate-100">
                            <!-- Injections JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 🚀 MODAL D'ÉDITION & FACTURATION -->
    <div id="edit-modal" class="hidden absolute inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800">Modifier la course</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 transition-colors"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <form id="editForm" class="p-6 space-y-5">
                <input type="hidden" id="edit-ride-id">
                
                <div class="space-y-1">
                    <label class="text-sm font-bold text-slate-700">Statut de la course</label>
                    <select id="edit-status" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20 bg-white">
                        <option value="En attente">En attente</option>
                        <option value="À venir">À venir</option>
                        <option value="Terminée">Terminée</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-sm font-bold text-slate-700">Statut de facturation</label>
                    <select id="edit-facturation" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 bg-white">
                        <option value="Non facturé">Non facturé</option>
                        <option value="Facturé">Facturé</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-sm font-bold text-slate-700">Km Réels</label>
                        <input type="number" step="0.1" id="edit-km" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20" placeholder="Ex: 15.5">
                    </div>
                    <div class="space-y-1">
                        <label class="text-sm font-bold text-slate-700">Péages (€)</label>
                        <input type="number" step="0.1" id="edit-peage" class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-500/20" placeholder="Ex: 2.50">
                    </div>
                </div>

                <button type="submit" id="saveBtn" class="w-full bg-slate-900 text-white font-bold text-lg rounded-xl p-4 hover:bg-slate-800 mt-2 transition-colors flex justify-center items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Sauvegarder
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const LOGIN_API_URL = '/api/auth/login'; 
        const RIDES_API_URL = '/api/rides';

        let allMyRides = []; // Stockage global des courses pour l'édition

        // --- CONNEXION ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch(LOGIN_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                
                if (res.ok && data.token) {
                    localStorage.setItem('driverToken', data.token);
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    loadData(); 
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (err) { alert("Erreur de connexion"); }
        });

        // --- CHARGEMENT DES DONNÉES ---
        async function loadData() {
            const token = localStorage.getItem('driverToken');
            try {
                const res = await fetch(RIDES_API_URL, { headers: { 'Authorization': `Bearer ${token}` } });
                
                if (res.status === 401 || res.status === 403) { logout(); return; }

                allMyRides = await res.json(); // On stocke les données
                const tbody = document.getElementById('rides-table');
                tbody.innerHTML = '';
                
                document.getElementById('ride-count').innerText = `${allMyRides.length} course(s)`;

                if (allMyRides.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500 font-medium">Aucune course prévue.</td></tr>`;
                    return;
                }

                allMyRides.forEach(ride => {
                    const dateObj = new Date(ride.date);
                    const dateStr = dateObj.toLocaleDateString('fr-FR') + ' à ' + dateObj.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                    
                    // Badges de statut
                    let statusColor = 'bg-slate-100 text-slate-700';
                    if (ride.status === 'En attente') statusColor = 'bg-yellow-100 text-yellow-700';
                    if (ride.status === 'Terminée') statusColor = 'bg-green-100 text-green-700';
                    if (ride.status === 'À venir') statusColor = 'bg-blue-100 text-blue-700';

                    // Badges de facturation
                    let factuColor = ride.statuFacturation === 'Facturé' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-50 text-red-600 border border-red-100';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 font-medium text-sm text-slate-900">${dateStr}</td>
                            <td class="px-6 py-4 font-bold text-sm text-slate-800">${ride.patientName}</td>
                            <td class="px-6 py-4 text-sm text-slate-600 truncate max-w-[200px]">${ride.startLocation} ➔ ${ride.endLocation}</td>
                            <td class="px-6 py-4"><span class="px-3 py-1 text-xs font-bold rounded-full ${statusColor}">${ride.status}</span></td>
                            <td class="px-6 py-4"><span class="px-3 py-1 text-xs font-bold rounded-full ${factuColor}">${ride.statuFacturation || 'Non facturé'}</span></td>
                            <td class="px-6 py-4 text-right">
                                <button onclick="openModal('${ride._id}')" class="bg-white border border-slate-200 hover:border-yellow-500 hover:text-yellow-600 text-slate-600 p-2 rounded-lg transition-all shadow-sm">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
                lucide.createIcons(); // Réinjecte les icônes sur les nouveaux boutons
            } catch (err) { console.error(err); }
        }

        // --- GESTION DU MODAL ---
        function openModal(rideId) {
            const ride = allMyRides.find(r => r._id === rideId);
            if (!ride) return;

            document.getElementById('edit-ride-id').value = ride._id;
            document.getElementById('edit-status').value = ride.status;
            document.getElementById('edit-facturation').value = ride.statuFacturation || 'Non facturé';
            document.getElementById('edit-km').value = ride.realDistance || '';
            document.getElementById('edit-peage').value = ride.tolls || '';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        // --- SAUVEGARDE DES MODIFICATIONS (PATCH VERS L'API) ---
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            btn.disabled = true;

            const id = document.getElementById('edit-ride-id').value;
            const payload = {
                status: document.getElementById('edit-status').value,
                statuFacturation: document.getElementById('edit-facturation').value,
                realDistance: parseFloat(document.getElementById('edit-km').value) || 0,
                tolls: parseFloat(document.getElementById('edit-peage').value) || 0
            };

            const token = localStorage.getItem('driverToken');

            try {
                const response = await fetch(`${RIDES_API_URL}/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    closeModal();
                    loadData(); // Rafraîchit le tableau
                } else {
                    alert("Erreur lors de la sauvegarde.");
                }
            } catch (err) {
                alert("Problème réseau.");
            } finally {
                btn.innerHTML = `<i data-lucide="save" class="w-5 h-5"></i> Sauvegarder`;
                btn.disabled = false;
                lucide.createIcons();
            }
        });

        function logout() {
            localStorage.removeItem('driverToken');
            document.getElementById('password').value = '';
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // Vérification au démarrage
        if (localStorage.getItem('driverToken')) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            loadData();
        }
</script>
</body>
</html>
