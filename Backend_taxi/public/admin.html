<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Taxi 31</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-slate-800">

    <!-- ÉCRAN DE CONNEXION (Visible par défaut) -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
            <div class="text-center mb-8">
                <i data-lucide="shield-alert" class="w-12 h-12 text-yellow-500 mx-auto mb-4"></i>
                <h1 class="text-2xl font-bold text-white">Accès Sécurisé</h1>
                <p class="text-slate-400 text-sm">Tableau de bord administrateur</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <input type="password" id="password" required placeholder="Mot de passe" 
                    class="w-full bg-slate-900 border border-slate-600 rounded-xl p-4 text-white focus:border-yellow-500 outline-none">
                <p id="login-error" class="text-red-400 text-sm hidden font-bold text-center">Mot de passe incorrect</p>
                <button type="submit" class="w-full bg-yellow-500 text-slate-900 font-bold text-lg rounded-xl p-4 hover:bg-yellow-400">
                    Se connecter
                </button>
            </form>
        </div>
    </div>

    <!-- TABLEAU DE BORD (Caché au départ) -->
    <div id="dashboard-screen" class="hidden flex h-full">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="bg-yellow-500 p-2 rounded-lg text-slate-900"><i data-lucide="layout-dashboard" class="w-6 h-6"></i></div>
                <span class="text-xl font-bold">Admin<span class="text-yellow-500">Panel</span></span>
            </div>
            <div class="mt-auto p-4 border-t border-slate-800">
                <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 w-full text-slate-400 hover:text-red-400 transition-colors">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Déconnexion
                </button>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="flex-1 flex flex-col h-full overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-8 py-5">
                <h1 class="text-2xl font-bold">Base de données des Courses</h1>
            </header>

            <div class="p-8">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                                <th class="px-6 py-4">Date</th>
                                <th class="px-6 py-4">Patient</th>
                                <th class="px-6 py-4">Trajet</th>
                                <th class="px-6 py-4">Statut</th>
                            </tr>
                        </thead>
                        <tbody id="rides-table" class="divide-y divide-slate-100">
                            <!-- Injections JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        // Gestion de la connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('adminToken', data.token);
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    loadData(); // On charge les données !
                } else {
                    document.getElementById('login-error').classList.remove('hidden');
                }
            } catch (err) { alert("Erreur de connexion au serveur"); }
        });

        // Chargement des vraies données
        async function loadData() {
            const token = localStorage.getItem('adminToken');
            try {
                const res = await fetch('/api/admin/rides', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.status === 401 || res.status === 400) {
                    logout(); // Token expiré
                    return;
                }

                const rides = await res.json();
                const tbody = document.getElementById('rides-table');
                tbody.innerHTML = '';

                rides.forEach(ride => {
                    const dateObj = new Date(ride.date);
                    const dateStr = dateObj.toLocaleDateString('fr-FR') + ' à ' + dateObj.toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});
                    
                    let statusColor = 'bg-slate-100 text-slate-700';
                    if (ride.status === 'En attente') statusColor = 'bg-yellow-100 text-yellow-700';
                    if (ride.status === 'Terminée') statusColor = 'bg-green-100 text-green-700';

                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-6 py-4 font-medium text-sm text-slate-900">${dateStr}</td>
                            <td class="px-6 py-4 font-bold text-sm text-slate-800">${ride.patientName}</td>
                            <td class="px-6 py-4 text-sm text-slate-600">${ride.startLocation} ➔ ${ride.endLocation}</td>
                            <td class="px-6 py-4"><span class="px-3 py-1 text-xs font-bold rounded-full ${statusColor}">${ride.status}</span></td>
                        </tr>
                    `;
                });
            } catch (err) { console.error(err); }
        }

        // Déconnexion
        function logout() {
            localStorage.removeItem('adminToken');
            document.getElementById('password').value = '';
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        // Vérification automatique au lancement de la page
        if (localStorage.getItem('adminToken')) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            loadData();
        }
    </script>
</body>
</html>
